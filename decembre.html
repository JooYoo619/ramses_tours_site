
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>برامج العمرة - دجنبر | RAMSES TOURS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      background: #071b2b;
    }

    header {
      padding: 22px;
      background: #031223;
      border-bottom: 1px solid #d6aa51;
    }

    header a {
      color: #e9bd62;
      text-decoration: none;
    }

    main {
      padding: 45px 20px;
    }

    h1 {
      color: #e9bd62;
      font-size: 36px;
    }

    .subtitle {
      margin-bottom: 35px;
      line-height: 1.8;
    }

    .programs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 340px));
      justify-content: center;
      gap: 25px;
    }

    .program-card {
      min-height: 300px;
      padding: 18px;
      background: #102b43;
      border: 1px solid #d6aa51;
      border-radius: 16px;
    }

    .program-card img {
      width: 100%;
      height: 400px;
      object-fit: contain;
      border-radius: 10px;
    }

    .empty {
      height: 230px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e9bd62;
      border: 1px dashed #d6aa51;
      border-radius: 10px;
    }

    .program-card h2 {
      color: #e9bd62;
      font-size: 21px;
    }

    .back-btn {
      display: inline-block;
      margin-top: 35px;
      padding: 12px 25px;
      color: #071b2b;
      background: #e9bd62;
      border-radius: 25px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header>
    <a href="umrah.html">العودة إلى برامج العمرة</a>
  </header>

  <main>
    <h1>برامج العمرة - دجنبر</h1>
    <p class="subtitle">اكتشف برامج العمرة المتوفرة خلال شهر دجنبر</p>

    <div class="programs">

<div class="program-card">
<img src="programmes/decembre/12 ET 16 DEC DONE 2.png" alt="البرنامج الأول">  <h2>برنامج 12 و 16 دجنبر </h2>
</div>
      <div class="program-card">
<img src="programmes/decembre/19 ET 22 DEC DONE 2.png" alt="برنامج دجنبر 2">        <h2>برنامج 19 و 22 دجنبر </h2>
      </div>
<div class="program-card">
  <img src="programmes/decembre/26 ET 30 DEC DONE 2.png" alt="برنامج دجنبر 3">
  <h2>برنامج 26 و 30 دجنبر</h2>
</div>
    <a href="umrah.html" class="back-btn">العودة إلى الأشهر</a>
  </main>

</body>
</html>
